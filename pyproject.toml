[project]
name = "monobot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.20",
    "aiohttp>=3.13.3",
    "alembic>=1.18.4",
    "asyncpg>=0.30",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.4",
    "celery-redbeat>=2.2",
    "cryptography>=46.0.5",
    "ecdsa>=0.19",
    "fastapi[standard]>=0.135.1",
    "greenlet>=3.3.2",
    "httpx>=0.28",
    "psycopg2-binary>=2.9",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "redis[hiredis]>=5.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
